name: Atualizar arte do perfil

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: profile-art
  cancel-in-progress: false

jobs:
  profile-art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/fetch_contributions.py
        env:
          GH_USERNAME: ${{ github.repository_owner }}
      - run: python scripts/render_heatmap_svg.py
      - run: python scripts/make_info_card.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: atualiza arte do perfil [skip ci]'
          file_pattern: 'data/contributions.json contrib-heatmap.svg info-card.svg'
